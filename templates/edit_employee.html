<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 32px; }
        input { margin: 5px 0 14px; padding: 8px; width: 280px; max-width: 90%; }
        button, a { padding: 8px 12px; border: 0; border-radius: 4px; text-decoration: none; cursor: pointer; }
        button { background: #198754; color: white; }
        a { background: #6c757d; color: white; display: inline-block; }
    </style>
</head>
<body>
    <h2>Update Data Employee</h2>
    <form action="{{ url_for('employee_bp.update_employee', id=employee.id) }}" method="POST">
        <label for="name">Nama:</label><br>
        <input id="name" type="text" name="name" value="{{ employee.name }}" required><br>
        <label for="position">Posisi:</label><br>
        <input id="position" type="text" name="position" value="{{ employee.position }}" required><br>
        <label for="salary">Gaji:</label><br>
        <input id="salary" type="number" name="salary" min="0" value="{{ employee.salary }}" required><br>
        <button type="submit">Simpan Perubahan</button>
        <a href="{{ url_for('employee_bp.show_form') }}">Batal</a>
    </form>
</body>
</html>
